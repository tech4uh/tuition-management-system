<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tuition">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Tuition Manager</title>


  <!-- Apply the saved theme immediately (no white/black flash) -->
  <script>
    try {
      document.documentElement.setAttribute('data-theme',
        localStorage.getItem('tuition_theme') === 'dark' ? 'dark' : 'light');
    } catch (e) {}
  </script>


  <!-- Opening screen styles (inline so they paint instantly) -->
  <style>
    html { background: #f4f6fb; }
    html[data-theme="dark"] { background: #0b1220; }


    #splash {
      position: fixed; inset: 0; z-index: 100010;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #f4f6fb;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: opacity .35s ease, visibility .35s ease;
    }
    html[data-theme="dark"] #splash { background: #0b1220; }
    #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }


    .sp-logo {
      width: 84px; height: 84px; border-radius: 24px; background: #4f46e5; color: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 30px rgba(79, 70, 229, .35);
      animation: spPop .6s cubic-bezier(.2, .8, .2, 1) both;
    }
    .sp-logo path {
      stroke-dasharray: 1; stroke-dashoffset: 1;
      animation: spDraw .8s .25s ease forwards;
    }
    .sp-name {
      margin-top: 18px; font-size: 22px; font-weight: 700; line-height: 1.2; color: #0f172a;
      animation: spUp .5s .3s ease both;
    }
    .sp-sub {
      margin-top: 4px; font-size: 13px; color: #64748b;
      animation: spUp .5s .4s ease both;
    }
    .sp-bar {
      margin-top: 26px; width: 120px; height: 3px; border-radius: 3px; overflow: hidden;
      background: rgba(79, 70, 229, .15);
      animation: spUp .5s .5s ease both;
    }
    .sp-bar i {
      display: block; height: 100%; width: 40%; border-radius: 3px; background: #4f46e5;
      animation: spSlide 1.1s ease-in-out infinite;
    }
    html[data-theme="dark"] .sp-name { color: #f1f5f9; }
    html[data-theme="dark"] .sp-sub { color: #94a3b8; }
    html[data-theme="dark"] .sp-bar { background: rgba(165, 180, 252, .18); }
    html[data-theme="dark"] .sp-bar i { background: #818cf8; }


    @keyframes spPop {
      from { opacity: 0; transform: scale(.7); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes spDraw { to { stroke-dashoffset: 0; } }
    @keyframes spUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes spSlide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sp-logo, .sp-name, .sp-sub, .sp-bar, .sp-bar i { animation: none; }
      .sp-logo path { animation: none; stroke-dashoffset: 0; }
    }
  </style>


  <link rel="stylesheet" href="css/style.css">
</head>
<body>


  <!-- Opening screen -->
  <div id="splash">
    <div class="sp-logo">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path pathLength="1" d="M22 10L12 5 2 10l10 5 10-5z"/>
        <path pathLength="1" d="M6 12v5c3 2 9 2 12 0v-5"/>
      </svg>
    </div>
    <div class="sp-name">Tuition Manager</div>
    <div class="sp-sub">Groups, students and fees</div>
    <div class="sp-bar"><i></i></div>
  </div>



  <header id="topbar">
    <div class="tb-logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>
    </div>
    <b class="tb-name">Tuition Manager</b>
  </header>



  <nav id="nav">
    <button data-tab="dashboard">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      <em class="lbl">Dashboard</em>
    </button>
    <button data-tab="students">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <em class="lbl">Students</em>
    </button>
    <button data-tab="groups">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <em class="lbl">Groups</em>
    </button>
  </nav>



  <main><div class="wrap" id="view"></div></main>
  <div id="modal"><div id="box"></div></div>
  <input type="file" id="importFile" accept=".json" style="display:none">



  <!-- Script order is important, do not change it -->
  <script src="js/helpers.js"></script>
  <script src="js/extras.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/students.js"></script>
  <script src="js/groups.js"></script>
  <script src="js/app.js"></script>



  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/reminder.js"></script>



  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>


  <!-- Hide the opening screen once the app (login or dashboard) is ready -->
  <script>
    (function () {
      var s = document.getElementById('splash');
      if (!s) return;
      var t0 = Date.now(), MIN = 900, MAX = 4000, done = false;
      function hide() {
        if (done) return;
        done = true;
        s.classList.add('hide');
        setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 450);
      }
      function ready() {
        return document.getElementById('cl_overlay') || document.getElementById('pf_btn');
      }
      function tick() {
        var el = Date.now() - t0;
        if (el >= MAX || (el >= MIN && ready())) hide();
        else setTimeout(tick, 100);
      }
      tick();
    })();
  </script>
</body>
</html>
